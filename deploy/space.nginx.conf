# /etc/nginx/sites-available/space
# space.dibberlab.me (Sedna): static site, no app server.
# nginx serves site/ straight from the git checkout at /var/www/space.
#
# TLS: dibberlab.me is proxied through Cloudflare. This expects a Cloudflare
# origin cert at the paths below; setup-from-mac.sh links the existing
# *.dibberlab.me cert here, or stops and says how to make one.

server {
    listen 80;
    listen [::]:80;
    server_name space.dibberlab.me;
    return 301 https://space.dibberlab.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name space.dibberlab.me;

    ssl_certificate     /etc/ssl/cloudflare/space.dibberlab.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/space.dibberlab.me.key;

    root /var/www/space/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Browsers recheck files on every load (cheap ETag check), so a deploy
    # shows up right away.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Web-app manifest: nginx's stock mime.types doesn't know .webmanifest
    # and would send application/octet-stream. No add_header here, so the
    # server-level headers above still apply.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        expires -1;
    }

    # Satellite orbits: the copy the cron refreshes every 8 hours
    # (deploy/space-tle.cron), or the repo's committed copy if that's missing.
    location = /data/visual.tle {
        root /var/lib/space;
        default_type text/plain;
        add_header Cache-Control "max-age=600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @tle_repo;
    }
    location @tle_repo {
        root /var/www/space/site;
        default_type text/plain;
        add_header Cache-Control "max-age=600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
