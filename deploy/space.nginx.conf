# /etc/nginx/sites-available/space
# space.dibberlab.me: static site, no app server.
# nginx serves site/ straight from the git checkout at /var/www/space.
#
# TLS: dibberlab.me is proxied through Cloudflare. This expects a Cloudflare
# origin cert at the paths below; setup-from-mac.sh links the existing
# *.dibberlab.me cert here, or stops and says how to make one.

server {
    listen 80;
    listen [::]:80;
    server_name space.dibberlab.me;
    return 301 https://space.dibberlab.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name space.dibberlab.me;

    ssl_certificate     /etc/ssl/cloudflare/space.dibberlab.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/space.dibberlab.me.key;

    root /var/www/space/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Browsers recheck files on every load (cheap ETag check), so a deploy
    # shows up right away.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
